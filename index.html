<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VORTEX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#07070a;
  --bg-2:#0c0c12;
  --panel:#101017;
  --panel-2:#14141d;
  --line:#22222e;
  --ink:#eeecf6;
  --ink-dim:#8b899e;
  --violet:#8b6bff;
  --violet-dim:#5c4ab8;
  --cyan:#2fe8d0;
  --amber:#e8a94f;
  --danger:#ff5d6c;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Space Grotesk',sans-serif;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
::selection{background:var(--violet-dim);}

#stage{position:relative;width:100vw;height:100vh;height:100dvh;}

/* background field */
#field{position:absolute;inset:0;z-index:0;}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.85) 100%);}
#grain{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.035;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,transparent 1px,transparent 3px);}

/* top bar */
#topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
  gap:12px;padding:16px 16px 0;}
#brandmark{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#brandmark .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);}
#brandmark span{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--ink-dim);}

#textform{flex:1;display:flex;}
#textbar{flex:1;display:flex;align-items:center;gap:8px;background:rgba(16,16,23,.78);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;backdrop-filter:blur(10px);
  transition:border-color .2s;}
#textbar:focus-within{border-color:var(--violet);}
#textin{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13px;
  font-family:'Space Grotesk',sans-serif;min-width:0;}
#textin::placeholder{color:#54536a;}
#textsend{background:none;border:none;color:var(--ink-dim);cursor:pointer;padding:2px;
  display:flex;align-items:center;}
#textsend:hover{color:var(--cyan);}

#gearbtn{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:rgba(16,16,23,.78);color:var(--ink-dim);display:flex;align-items:center;
  justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:.2s;}
#gearbtn:hover{color:var(--ink);border-color:var(--violet);}

/* hero / vortex */
#hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:5;pointer-events:none;}
canvas#swirl{width:min(78vmin,480px);height:min(78vmin,480px);}
#wordmark{margin-top:-6vmin;font-size:clamp(28px,7vw,44px);font-weight:700;letter-spacing:.02em;
  background:linear-gradient(120deg,var(--ink) 30%,var(--cyan) 55%,var(--violet) 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
#substate{margin-top:6px;font-size:11px;letter-spacing:.16em;color:var(--ink-dim);
  font-family:'JetBrains Mono',monospace;min-height:16px;text-align:center;}

/* transcript */
#transcript{position:absolute;left:0;right:0;bottom:118px;z-index:20;
  max-height:46vh;overflow-y:auto;padding:0 18px;display:flex;flex-direction:column;
  gap:10px;scrollbar-width:none;}
#transcript::-webkit-scrollbar{display:none;}
.bubble{max-width:min(520px,88vw);margin:0 auto;width:100%;opacity:0;transform:translateY(10px);
  animation:bubbleIn .45s cubic-bezier(.2,.8,.25,1) forwards;}
@keyframes bubbleIn{to{opacity:1;transform:translateY(0);}}
.bubble.user{display:flex;justify-content:flex-end;}
.bubble.user .txt{background:var(--panel-2);border:1px solid var(--line);border-radius:14px 14px 4px 14px;
  padding:9px 14px;font-size:13px;color:var(--ink);max-width:80%;}
.bubble.vortex .txt{background:rgba(139,107,255,.08);border:1px solid rgba(139,107,255,.25);
  border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);
  max-width:92%;}
.bubble.vortex .tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
  color:var(--cyan);margin-bottom:5px;display:block;}

/* mic */
#micwrap{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column;align-items:center;gap:8px;}
#michint{font-size:10px;letter-spacing:.1em;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;}
#micbtn{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
  background:radial-gradient(circle at 40% 35%,#1c1c28,#0d0d13);display:flex;align-items:center;
  justify-content:center;position:relative;transition:border-color .25s,transform .15s;}
#micbtn:active{transform:scale(.95);}
#micbtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.6;}
#micbtn.listening{border-color:var(--cyan);}
#micbtn.listening svg{stroke:var(--cyan);}
#micbtn.speaking{border-color:var(--violet);}
#micring{position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--cyan);opacity:0;}
#micbtn.listening #micring{animation:ringPulse 1.4s ease-out infinite;}
@keyframes ringPulse{0%{opacity:.6;transform:scale(.9);}100%{opacity:0;transform:scale(1.5);}}

#continuousToggle{position:absolute;bottom:30px;right:20px;font-size:11px;color:var(--ink-dim);
  cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;transition:.2s;}
#continuousToggle:hover{border-color:var(--cyan);color:var(--cyan);}
#continuousToggle.active{border-color:var(--violet);color:var(--violet);}

/* settings panel */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .3s;}
#scrim.visible{opacity:1;pointer-events:auto;}
#settings{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:61;transform:translateX(100%);
  transition:transform .38s cubic-bezier(.2,.8,.25,1);padding:22px 20px;overflow-y:auto;}
#settings.visible{transform:translateX(0);}
#settings h2{font-size:15px;letter-spacing:.06em;margin:0 0 4px;}
#settings .sub{font-size:11.5px;color:var(--ink-dim);margin:0 0 22px;line-height:1.5;}
#settings label{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink-dim);
  font-family:'JetBrains Mono',monospace;margin-bottom:7px;}
#keyrow{display:flex;gap:8px;margin-bottom:8px;}
#keyinput{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
  padding:10px 11px;color:var(--ink);font-size:12.5px;font-family:'JetBrains Mono',monospace;
  outline:none;min-width:0;}
#keyinput:focus{border-color:var(--violet);}
#togglevis{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink-dim);
  width:38px;cursor:pointer;flex-shrink:0;}
.btn{flex:1;border-radius:9px;padding:10px 12px;font-size:12px;letter-spacing:.03em;
  cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  transition:.2s;text-align:center;}
.btn.primary{background:linear-gradient(120deg,var(--violet),var(--cyan));color:#08080c;
  border:none;font-weight:600;}
.btn:hover{filter:brightness(1.12);}
#keystatus{font-size:11px;font-family:'JetBrains Mono',monospace;margin-bottom:22px;min-height:14px;}
#keystatus.ok{color:var(--cyan);}
#keystatus.err{color:var(--danger);}
</style>
</head>
<body>
<div id="stage">
  <div id="field"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  
  <div id="topbar">
    <div id="brandmark">
      <div class="dot"></div>
      <span>VORTEX</span>
    </div>
    <form id="textform">
      <div id="textbar">
        <input type="text" id="textin" placeholder="Ask me anything or say a command…">
        <button type="submit" id="textsend">
          <svg viewBox="0 0 24 24"><path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.40,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16640504 C3.34915502,0.9 2.40734225,0.9 1.77946707,1.4467409 C0.994623095,2.0605983 0.837654326,3.0603889 1.15159189,3.84588578 L3.03521743,10.2868788 C3.03521743,10.4439762 3.34915502,10.6010735 3.50612381,10.6010735 L16.6915026,11.3865604 C16.6915026,11.3865604 17.1624089,11.3865604 17.1624089,10.9152682 L17.1624089,12.0274007 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"/></svg>
        </button>
      </div>
    </form>
    <button id="gearbtn">⚙️</button>
  </div>

  <div id="hero">
    <canvas id="swirl"></canvas>
    <div id="wordmark">VORTEX</div>
    <div id="substate">Ready to listen</div>
  </div>

  <div id="transcript"></div>

  <div id="micwrap">
    <div id="michint">VOICE INPUT READY • TAP TO SPEAK</div>
    <button id="micbtn">
      <svg viewBox="0 0 24 24"><path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4M12,6C8.69,6 6,8.69 6,12C6,15.31 8.69,18 12,18C15.31,18 18,15.31 18,12C18,8.69 15.31,6 12,6Z"/></svg>
      <div id="micring"></div>
    </button>
    <div id="continuousToggle">CONTINUOUS: OFF</div>
  </div>

  <div id="scrim"></div>
  <div id="settings">
    <h2>GEMINI API KEY</h2>
    <p class="sub">Get your free key from <a href="https://aistudio.google.com" target="_blank" rel="noopener" style="color:var(--cyan)">aistudio.google.com</a></p>
    <div id="keyrow">
      <input type="password" id="keyinput" placeholder="paste your key here">
      <button id="togglevis">👁</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="savekey" class="btn primary">SAVE</button>
      <button id="clearkey" class="btn">CLEAR</button>
    </div>
    <div id="keystatus"></div>
  </div>
</div>

<script>
/* =====================================================
   GLOBALS & STATE
===================================================== */
const V = {
  key: localStorage.getItem('vortex_gemini_key') || '',
  listening: false,
  speaking: false,
  processing: false,
  continuousMode: false
};

function setStatus(text){
  document.getElementById('substate').textContent = text;
}

/* =====================================================
   SETTINGS PANEL
===================================================== */
const settingsEl = document.getElementById('settings');
const scrimEl = document.getElementById('scrim');
const keyinput = document.getElementById('keyinput');
keyinput.value = V.key;

function openSettings(){ settingsEl.classList.add('visible'); scrimEl.classList.add('visible'); }
function closeSettings(){ settingsEl.classList.remove('visible'); scrimEl.classList.remove('visible'); }
document.getElementById('gearbtn').addEventListener('click', openSettings);
scrimEl.addEventListener('click', closeSettings);

document.getElementById('togglevis').addEventListener('click', ()=>{
  keyinput.type = keyinput.type==='password' ? 'text' : 'password';
});

document.getElementById('savekey').addEventListener('click', ()=>{
  const v = keyinput.value.trim();
  const statusEl = document.getElementById('keystatus');
  if(!v){ statusEl.textContent = 'ENTER A KEY FIRST'; statusEl.className='mono err'; return; }
  V.key = v;
  localStorage.setItem('vortex_gemini_key', v);
  statusEl.textContent = 'KEY SAVED — VORTEX IS READY';
  statusEl.className = 'mono ok';
  setTimeout(closeSettings, 700);
});

document.getElementById('clearkey').addEventListener('click', ()=>{
  V.key = '';
  keyinput.value = '';
  localStorage.removeItem('vortex_gemini_key');
  const statusEl = document.getElementById('keystatus');
  statusEl.textContent = 'KEY REMOVED';
  statusEl.className = 'mono';
});

if(!V.key) setTimeout(openSettings, 500);

/* =====================================================
   TRANSCRIPT
===================================================== */
function addBubble(role, text, tag){
  const wrap = document.getElementById('transcript');
  const el = document.createElement('div');
  el.className = 'bubble ' + role;
  if(role==='user'){
    el.innerHTML = `<div class="txt">${escapeHtml(text)}</div>`;
  }else{
    el.innerHTML = `<div class="txt">${tag?`<span class="tag mono">${escapeHtml(tag)}</span>`:''}${escapeHtml(text)}</div>`;
  }
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* =====================================================
   SPEECH: recognition + synthesis
===================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
if(SR){
  recognizer = new SR();
  recognizer.continuous = false;
  recognizer.interimResults = false;
  recognizer.lang = 'en-US';
  recognizer.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    document.getElementById('textin').value = text;
    handleQuery(text);
  };
  recognizer.onend = ()=>{ 
    V.listening=false; 
    setAssistantMode('idle'); 
    setStatus('STANDBY — SAY OR TYPE A COMMAND');
    // Auto-restart if continuous mode is on and not processing
    if(V.continuousMode && !V.processing && !V.speaking){
      setTimeout(startListening, 500);
    }
  };
  recognizer.onerror = ()=>{ V.listening=false; setAssistantMode('idle'); setStatus('MIC ERROR — TRY TYPING INSTEAD'); };
}else{
  document.getElementById('michint').textContent = 'VOICE UNSUPPORTED — TYPE INSTEAD';
}

function startListening(){
  if(!recognizer || V.listening || V.processing || V.speaking) return;
  try{
    recognizer.start();
    V.listening = true;
    setAssistantMode('listening');
    setStatus('LISTENING…');
  }catch(err){ /* already started */ }
}

const micbtn = document.getElementById('micbtn');
micbtn.addEventListener('click', ()=>{
  if(!recognizer) return;
  if(V.listening){ recognizer.stop(); return; }
  startListening();
});

// Continuous mode toggle
const continuousBtn = document.getElementById('continuousToggle');
continuousBtn.addEventListener('click', ()=>{
  V.continuousMode = !V.continuousMode;
  continuousBtn.classList.toggle('active', V.continuousMode);
  continuousBtn.textContent = `CONTINUOUS: ${V.continuousMode ? 'ON' : 'OFF'}`;
  if(V.continuousMode && !V.listening && !V.processing && !V.speaking){
    startListening();
  }
});

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;
  // Try to use a natural voice
  const voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    u.voice = voices[0]; // Use first available voice
  }
  u.onstart = ()=>{ V.speaking=true; setAssistantMode('speaking'); };
  u.onend = ()=>{ 
    V.speaking=false; 
    setAssistantMode('idle'); 
    setStatus('STANDBY — SAY OR TYPE A COMMAND');
    // Auto-restart if continuous mode is on
    if(V.continuousMode && !V.processing){
      setTimeout(startListening, 300);
    }
  };
  window.speechSynthesis.speak(u);
}

/* =====================================================
   VORTEX SWIRL HERO
===================================================== */
const SwirlFX = (function(){
  const c = document.getElementById('swirl');
  const ctx = c.getContext('2d');
  let size=0, particles=[], mode='idle', t=0;

  function resize(){
    const rect = c.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio||1,2);
    size = rect.width;
    c.width = rect.width*dpr; c.height = rect.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);

  const N = 140;
  for(let i=0;i<N;i++){
    particles.push({
      a: Math.random()*Math.PI*2,
      r: 20 + Math.random()*150,
      speed: 0.002 + Math.random()*0.006,
      drift: Math.random()*0.6+0.4,
      size: Math.random()*2+0.6
    });
  }

  function colorFor(mode){
    if(mode==='listening') return '47,232,208';
    if(mode==='speaking') return '139,107,255';
    if(mode==='busy') return '232,169,79';
    return '139,107,255';
  }

  function frame(){
    requestAnimationFrame(frame);
    if(!size){ resize(); if(!size) return; }
    const cx = size/2, cy = size/2;
    ctx.clearRect(0,0,size,size);
    t += mode==='idle' ? 0.6 : (mode==='busy'?2.2:1.6);

    const col = colorFor(mode);
    const energyR = size*0.42;

    ctx.beginPath();
    ctx.arc(cx,cy, energyR*0.34 + Math.sin(t*0.05)*4, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${col},0.5)`;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    particles.forEach((p,i)=>{
      p.a += p.speed * (mode==='busy'?2.4:1) * p.drift;
      const wobble = Math.sin(t*0.01 + i)*8;
      const rr = (p.r/170) * energyR + wobble;
      const x = cx + Math.cos(p.a)*rr;
      const y = cy + Math.sin(p.a)*rr*0.94;
      const alpha = 0.15 + 0.55*(1-p.r/170);
      ctx.beginPath();
      ctx.arc(x,y,p.size,0,Math.PI*2);
      ctx.fillStyle = `rgba(${col},${alpha})`;
      ctx.fill();
    });

    ctx.beginPath();
    ctx.arc(cx,cy,energyR*0.7, t*0.01, t*0.01+1.4);
    ctx.strokeStyle = `rgba(${col},0.25)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  frame();

  return { set(m){ mode = m; } };
})();

function setAssistantMode(mode){
  SwirlFX.set(mode);
  document.getElementById('micbtn').classList.toggle('listening', mode==='listening');
  document.getElementById('micbtn').classList.toggle('speaking', mode==='speaking' || mode==='busy');
}

/* =====================================================
   GEMINI API (FIXED v2)
===================================================== */
async function callGemini(prompt, systemInstruction){
  if(!V.key) throw new Error('NO_KEY');
  
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(V.key)}`;
  
  const body = {
    systemInstruction: systemInstruction ? {parts:[{text: systemInstruction}]} : undefined,
    contents:[{
      role: 'user',
      parts:[{text: prompt}]
    }]
  };
  
  // Remove undefined fields
  if(!systemInstruction) delete body.systemInstruction;
  
  console.log('Sending to Gemini:', JSON.stringify(body, null, 2));
  
  try{
    const res = await fetch(url, { 
      method:'POST', 
      headers:{'Content-Type':'application/json'}, 
      body:JSON.stringify(body) 
    });
    
    const text = await res.text();
    console.log('Gemini raw response:', text);
    
    if(!res.ok){
      console.error('Gemini HTTP error:', res.status, text);
      throw new Error(`HTTP ${res.status}: ${text.slice(0, 100)}`);
    }
    
    const data = JSON.parse(text);
    
    if(data?.error){
      console.error('Gemini API error:', data.error);
      throw new Error(data.error.message || 'Unknown API error');
    }
    
    // Extract text from response
    const textContent = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!textContent){
      console.error('No text in response:', data);
      throw new Error('No text content in response');
    }
    
    return textContent;
  }catch(err){
    console.error('callGemini error:', err.message);
    throw err;
  }
}

/* =====================================================
   CLASSIFICATION & ROUTING (FIXED v2)
===================================================== */
async function classifyQuery(userText){
  if(!V.key){
    return {
      reply: "I need a Gemini API key to chat — add one in settings (top right)."
    };
  }
  
  try{
    // Simple direct query - no JSON extraction needed
    const systemPrompt = `You are VORTEX, a sharp and confident AI assistant. Keep responses brief and natural. Respond directly to what the user says - be conversational, insightful, and helpful. Keep responses under 30 words.`;

    const reply = await callGemini(userText, systemPrompt);
    
    console.log('Got reply:', reply);
    
    return {
      reply: reply.trim()
    };
  }catch(err){
    console.error('Classification error:', err);
    
    // Different errors
    if(err.message.includes('API key')){
      return {
        reply: "Your API key seems invalid. Check it in settings and try again."
      };
    }else if(err.message.includes('PERMISSION_DENIED')){
      return {
        reply: "API permission denied. Check your key has the right permissions."
      };
    }else{
      return {
        reply: `Error: ${err.message.slice(0, 50)}`
      };
    }
  }
}

/* =====================================================
   QUERY HANDLING
===================================================== */
document.getElementById('textform').addEventListener('submit', (e)=>{
  e.preventDefault();
  handleQuery(document.getElementById('textin').value);
});

async function handleQuery(text){
  if(!text || !text.trim() || V.processing) return;
  
  document.getElementById('textin').value = '';
  addBubble('user', text);
  
  V.processing = true;
  setAssistantMode('busy');
  setStatus('THINKING…');

  try{
    const result = await classifyQuery(text);
    const reply = result.reply || 'I understood but need a moment.';

    console.log('Final reply to speak:', reply);
    addBubble('vortex', reply);
    speak(reply);
    
  }catch(err){
    console.error('Query error:', err);
    const msg = 'Connection error. Check your API key in settings.';
    addBubble('vortex', msg);
    speak(msg);
  }finally{
    V.processing = false;
    setAssistantMode('idle');
    setStatus('STANDBY — SAY OR TYPE A COMMAND');
  }
}
</script>
